<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="220" height="42">
  <style>
    .main { font-family: Georgia, serif; font-size: 34px; font-weight: 700; fill:#111; }
    .accent { fill:#ff4d00; }
    .small { font-family: Arial, sans-serif; font-size:12px; letter-spacing:3px; fill:#555; }
  </style>

  <!-- Icon -->
